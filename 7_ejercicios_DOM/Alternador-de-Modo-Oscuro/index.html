<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Modo</title>
    <link rel="stylesheet" href="styles.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lora:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <main class="container">
      <article class="card">
        <header>
          <h1 class="titulo">La luz y la sombra</h1>
        </header>
 
        <p class="parrafo">
          Cada interfaz tiene dos caras: la claridad del día y el reposo de la
          noche. Ambas son válidas, ambas son necesarias. El diseño semántico
          respeta al usuario y le entrega el control de su propia experiencia
          visual.
        </p>
 
        <footer class="acciones">
          <button
            class="btn-modo"
            id="btnModo"
            type="button"
            aria-label="Cambiar entre modo claro y oscuro"
          >
            <span class="btn-icono" aria-hidden="true">☽</span>
            <span class="btn-texto">Cambiar Modo</span>
          </button>
        </footer>
      </article>
    </main>
    <script src="app.js"></script>
</body>
</html>
